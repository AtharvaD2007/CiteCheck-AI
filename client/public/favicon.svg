<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="citecheck-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30245F" />
      <stop offset="100%" stop-color="#7651D5" />
    </linearGradient>
    <linearGradient id="check-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Squircle App Icon Background with CiteCheck Purple Gradient -->
  <rect width="32" height="32" rx="7.5" fill="url(#citecheck-grad)" />

  <!-- Book Pages in Crisp White / Soft Lavender -->
  <path d="M7 9C10 8.5 13.5 9.5 16 11V23C13.5 21.5 10 20.8 7 21V9Z" fill="#EDE9FE" opacity="0.95" />
  <path d="M25 9C22 8.5 18.5 9.5 16 11V23C18.5 21.5 22 20.8 25 21V9Z" fill="#FFFFFF" />

  <!-- Spine Divider -->
  <line x1="16" y1="11" x2="16" y2="23" stroke="#4C1D95" stroke-width="1" stroke-linecap="round" />

  <!-- Verification Check Badge in Bottom Right -->
  <circle cx="22" cy="22" r="5.5" fill="url(#check-grad)" stroke="#FFFFFF" stroke-width="1.2" />
  <path d="M19.5 22L21.2 23.7L24.5 20.3" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- AI Sparkle in Top Right -->
  <path d="M23 4.5L23.7 6.3L25.5 7L23.7 7.7L23 9.5L22.3 7.7L20.5 7L22.3 6.3Z" fill="#FDE047" />
